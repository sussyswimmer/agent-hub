# Installers, for a release and at no other time.
#
# Runs when a `v*` tag is pushed, or by hand (Actions → Release → Run workflow) with the tag to
# build. The by-hand route builds the branch it is run from and creates the tag when the draft
# release is published, so a release can be cut without pushing a tag at all.
#
# macOS runners are billed at 10× on a private repository. Building installers on every push to
# every branch spent the account's included minutes in a day (DECISIONS 0023), so this workflow
# checks the version on Linux first and only then starts a Mac.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.0.3. It must match the version in src-tauri/tauri.conf.json."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: The tag names the version being built
        id: read
        run: |
          app=$(jq -r .version src-tauri/tauri.conf.json)
          npm=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$app" != "$npm" ] || [ "$app" != "$cargo" ]; then
            echo "::error::The versions disagree: tauri.conf.json $app, package.json $npm, Cargo.toml $cargo. Make them match, then build again."
            exit 1
          fi
          if [ "v$app" != "$TAG" ]; then
            echo "::error::The tag is $TAG but this commit is version $app. Build tag v$app, or bump the version to match $TAG."
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  macos:
    name: Package macOS ${{ matrix.architecture }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            runner: macos-14
          - architecture: x64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Composes the icons and builds the interface on the way (tauri.conf.json's
      # beforeBuildCommand), then bundles the .app and the .dmg.
      - name: Build the application
        run: bun run dist

      - name: Keep the disk image
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.architecture }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Package Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the installers
        run: bun run tauri build --bundles nsis,msi

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    needs: [version, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      # An existing release (made by hand, or by an earlier run) gets the files added or
      # replaced and is otherwise left as it is. A new one is a draft: nothing is public, and no
      # tag exists, until someone reads it and presses Publish.
      - name: Attach to the release
        run: |
          ls -l installers
          notes=".github/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" installers/* --draft --target "$GITHUB_SHA" --title "Grimoire $VERSION" --notes-file "$notes"
          else
            gh release create "$TAG" installers/* --draft --target "$GITHUB_SHA" --title "Grimoire $VERSION" --generate-notes
          fi
