# Every push and pull request: the whole test suite, on Linux.
#
# Linux minutes are billed at 1×; the macOS runners that build installers are billed at 10×. This
# workflow is the check a change gets, and it never touches a macOS runner. Installers are built
# by release.yml, on a tag or by hand, and nowhere else (DECISIONS 0023).

name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and lint (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # rust-toolchain.toml pins the channel and asks for clippy; rustup reads it.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      # Tauri builds against the system webview. These are the headers it compiles against on
      # Linux; the application itself is macOS-first (CLAUDE.md §2).
      - name: Install the system webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The icons are a build product (gitignored) that `generate_context!()` embeds at compile
      # time, so they must exist before any Rust is compiled. `tauri build` composes them itself;
      # a plain `cargo test` does not.
      - name: Compose the icons and build the interface
        run: |
          bun run icons
          bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test src

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Generated files are current
        run: |
          bun run bindings:check
          bun run licences
          git diff --exit-code -- THIRD-PARTY.md

      - name: Install the Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Interface tests
        run: bunx playwright test

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
