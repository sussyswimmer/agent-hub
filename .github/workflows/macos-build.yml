name: macOS build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: aarch64
            runner: macos-14
          - architecture: x64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run dist

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-macos-${{ matrix.architecture }}-app
          path: target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-macos-${{ matrix.architecture }}-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
